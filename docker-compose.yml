services:
  # ───── Database ─────
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - dbdata:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ───── Backend (production) ─────
  backend:
    build:
      context: ./backend
      target: production
    environment:
      APP_KEY: ${APP_KEY}
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost:8080}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  # ───── Frontend (production — nginx) ─────
  frontend:
    build:
      context: ./frontend
      target: production
    depends_on:
      - backend
    ports:
      - "8080:80"

  # ───── Backend dev/test (profile: dev) ─────
  backend-dev:
    build:
      context: ./backend
      target: dev
    profiles:
      - dev
    environment:
      APP_KEY: ${APP_KEY}
      APP_ENV: testing
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./backend:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "composer install --no-interaction && php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=8000"
    ports:
      - "8001:8000"

  # ───── Frontend dev/test (profile: dev) ─────
  frontend-dev:
    build:
      context: ./frontend
      target: dev
    profiles:
      - dev
    environment:
      VITE_API_BASE_URL: http://localhost:8001/api
    volumes:
      - ./frontend:/app
    depends_on:
      - backend-dev
    command: >
      sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"

volumes:
  dbdata:
